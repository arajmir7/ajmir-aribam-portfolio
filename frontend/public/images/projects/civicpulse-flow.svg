<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CivicPulse resilience workflow</title>
  <desc id="desc">Reports and sensor readings feed an explainable risk score and maintenance task.</desc>
  <rect width="1200" height="760" rx="36" fill="#f2f6ef"/>
  <text x="76" y="86" fill="#39755b" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">CIVICPULSE / RESEARCH &amp; LABS</text>
  <text x="76" y="152" fill="#183328" font-family="Arial,sans-serif" font-size="54" font-weight="800">Signals should end in a task.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(76 270)"><rect width="220" height="170" rx="20" fill="#fff" stroke="#b8d3c2" stroke-width="3"/><text x="28" y="50" fill="#39755b" font-size="16" font-weight="700" letter-spacing="2">01 / REPORT</text><text x="28" y="100" fill="#183328" font-size="28" font-weight="700">Citizen</text><text x="28" y="136" fill="#60766b" font-size="17">issue + photo</text></g>
    <g transform="translate(346 270)"><rect width="220" height="170" rx="20" fill="#fff" stroke="#b8d3c2" stroke-width="3"/><text x="28" y="50" fill="#39755b" font-size="16" font-weight="700" letter-spacing="2">02 / SENSOR</text><text x="28" y="100" fill="#183328" font-size="28" font-weight="700">Signal</text><text x="28" y="136" fill="#60766b" font-size="17">device-key ingest</text></g>
    <g transform="translate(616 270)"><rect width="220" height="170" rx="20" fill="#39755b"/><text x="28" y="50" fill="#d8f06b" font-size="16" font-weight="700" letter-spacing="2">03 / SCORE</text><text x="28" y="100" fill="#fff" font-size="28" font-weight="700">Risk</text><text x="28" y="136" fill="#d9eee2" font-size="17">rule-based + explainable</text></g>
    <g transform="translate(886 270)"><rect width="220" height="170" rx="20" fill="#fff" stroke="#b8d3c2" stroke-width="3"/><text x="28" y="50" fill="#39755b" font-size="16" font-weight="700" letter-spacing="2">04 / ACT</text><text x="28" y="100" fill="#183328" font-size="28" font-weight="700">Task</text><text x="28" y="136" fill="#60766b" font-size="17">assign + resolve</text></g>
  </g>
  <g stroke="#39755b" stroke-width="4" fill="none"><path d="M296 355h44"/><path d="M566 355h44"/><path d="M836 355h44"/></g>
  <text x="76" y="560" fill="#60766b" font-family="Arial,sans-serif" font-size="20">Local MVP · React, FastAPI, SQLAlchemy, sensor simulator and smoke-tested API path.</text>
  <text x="76" y="660" fill="#39755b" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">REPORTS  /  ASSETS  /  ALERTS  /  MAINTENANCE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Azaeron construction procurement flow</title>
  <desc id="desc">Project scope flows through a material catalogue, server pricing, checkout and RFQ approval.</desc>
  <rect width="1200" height="760" rx="36" fill="#e9f1ed"/>
  <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200M120 0v760M240 0v760M360 0v760M480 0v760M600 0v760M720 0v760M840 0v760M960 0v760M1080 0v760" stroke="#d5e4dd" stroke-width="2" opacity=".55"/>
  <text x="76" y="88" fill="#176454" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">AZAERON / PROCUREMENT FOUNDATION</text>
  <text x="76" y="150" fill="#102d2b" font-family="Georgia,serif" font-size="54" font-weight="700">Project buying with rules that hold.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(76 248)"><rect width="220" height="180" rx="20" fill="#fff" stroke="#b8d2c8" stroke-width="3"/><text x="28" y="46" fill="#176454" font-size="16" font-weight="700" letter-spacing="2">01 / PROJECT</text><text x="28" y="92" fill="#102d2b" font-size="28" font-weight="700">Scope</text><text x="28" y="126" fill="#526c64" font-size="17">materials · need</text><text x="28" y="153" fill="#526c64" font-size="17">by · budget</text></g>
    <g transform="translate(346 248)"><rect width="220" height="180" rx="20" fill="#176454"/><text x="28" y="46" fill="#d8f06b" font-size="16" font-weight="700" letter-spacing="2">02 / CATALOGUE</text><text x="28" y="92" fill="#fff" font-size="28" font-weight="700">Price</text><text x="28" y="126" fill="#d8ede6" font-size="17">server-owned</text><text x="28" y="153" fill="#d8ede6" font-size="17">tax · delivery</text></g>
    <g transform="translate(616 248)"><rect width="220" height="180" rx="20" fill="#fff" stroke="#b8d2c8" stroke-width="3"/><text x="28" y="46" fill="#176454" font-size="16" font-weight="700" letter-spacing="2">03 / REQUEST</text><text x="28" y="92" fill="#102d2b" font-size="28" font-weight="700">RFQ</text><text x="28" y="126" fill="#526c64" font-size="17">supplier quotes</text><text x="28" y="153" fill="#526c64" font-size="17">and negotiation</text></g>
    <g transform="translate(886 248)"><rect width="220" height="180" rx="20" fill="#fff" stroke="#b8d2c8" stroke-width="3"/><text x="28" y="46" fill="#176454" font-size="16" font-weight="700" letter-spacing="2">04 / POLICY</text><text x="28" y="92" fill="#102d2b" font-size="28" font-weight="700">Approve</text><text x="28" y="126" fill="#526c64" font-size="17">role checks</text><text x="28" y="153" fill="#526c64" font-size="17">and audit trail</text></g>
  </g>
  <g stroke="#176454" stroke-width="4" fill="none"><path d="M296 338h44"/><path d="M566 338h44"/><path d="M836 338h44"/></g>
  <text x="76" y="548" fill="#526c64" font-family="Arial,sans-serif" font-size="20">Local implementation map · external payment, supplier and warehouse integrations remain open.</text>
  <text x="76" y="650" fill="#176454" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">SERVER TOTALS  /  PROJECT CONTEXT  /  RFQ RECORDS  /  APPROVAL POLICY</text>
</svg>

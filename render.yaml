services:
  - type: pserv
    name: portfolio-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: python -m app.maintenance prepare-runtime-role && alembic upgrade head
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: DATABASE_RUNTIME_USER
        value: portfolio_app
      - key: DATABASE_RUNTIME_PASSWORD
        generateValue: true
      - key: CONTACT_INTERNAL_TOKEN
        generateValue: true
      - key: BUILD_REVISION
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: RENDER_GIT_COMMIT
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: DATABASE_POOL_TIMEOUT
        value: "10"
      - key: DATABASE_POOL_RECYCLE
        value: "300"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"

  - type: worker
    name: portfolio-email-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.delivery_worker
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: DATABASE_RUNTIME_USER
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: DATABASE_RUNTIME_USER
      - key: DATABASE_RUNTIME_PASSWORD
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: DATABASE_RUNTIME_PASSWORD
      - key: CONTACT_INTERNAL_TOKEN
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: CONTACT_INTERNAL_TOKEN
      - key: BUILD_REVISION
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: BUILD_REVISION
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: DATABASE_MAX_OVERFLOW
        value: "1"
      - key: DATABASE_POOL_TIMEOUT
        value: "10"
      - key: DATABASE_POOL_RECYCLE
        value: "300"
      - key: EMAIL_HOST
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: EMAIL_HOST
      - key: EMAIL_PORT
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: EMAIL_PORT
      - key: EMAIL_USER
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: EMAIL_USER
      - key: EMAIL_PASSWORD
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: EMAIL_PASSWORD
      - key: EMAIL_FROM
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: EMAIL_FROM
      - key: EMAIL_TO
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: EMAIL_TO
      - key: EMAIL_USE_TLS
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: EMAIL_USE_TLS

  - type: web
    name: portfolio-web
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    renderSubdomainPolicy: disabled
    domains:
      - ajmiraribam.me
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://ajmiraribam.me
      - key: CONTACT_ALLOWED_ORIGIN
        value: https://ajmiraribam.me
      - key: CONTACT_API_HOSTPORT
        fromService:
          name: portfolio-api
          type: pserv
          property: hostport
      - key: CONTACT_INTERNAL_TOKEN
        fromService:
          name: portfolio-api
          type: pserv
          envVarKey: CONTACT_INTERNAL_TOKEN
      - key: CONTACT_CLIENT_IP_HEADER
        value: x-forwarded-for
      - key: BUILD_REVISION
        fromService:
          name: portfolio-web
          type: web
          envVarKey: RENDER_GIT_COMMIT

  - type: cron
    name: portfolio-db-backup
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    schedule: "0 3 * * *"
    dockerfilePath: ./infra/backup/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: AWS_REGION
        value: ap-south-1
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        value: portfolio/prod
      - key: AWS_KMS_KEY_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio_migrator
    plan: 0.5c-1g
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []

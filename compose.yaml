services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - portfolio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:${POSTGRES_PASSWORD}@postgres:5432/portfolio
      CONTACT_INTERNAL_TOKEN: ${CONTACT_INTERNAL_TOKEN:?set CONTACT_INTERNAL_TOKEN}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-10}
      DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-300}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      BUILD_REVISION: ${BUILD_REVISION:-unknown}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
        ALLOW_INSECURE_SITE_URL: ${ALLOW_INSECURE_SITE_URL:-false}
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      CONTACT_API_URL: http://backend:8000
      CONTACT_INTERNAL_TOKEN: ${CONTACT_INTERNAL_TOKEN}
      CONTACT_ALLOWED_ORIGIN: ${CONTACT_ALLOWED_ORIGIN:-}
      CONTACT_CLIENT_IP_HEADER: ${CONTACT_CLIENT_IP_HEADER:-}
      BUILD_REVISION: ${BUILD_REVISION:-unknown}
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${PORTFOLIO_WEB_PORT:-3000}:3000"
    restart: unless-stopped
volumes:
  portfolio_db:

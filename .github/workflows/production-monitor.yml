name: production-monitor
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      production_url:
        description: HTTPS origin to inspect (defaults to the PRODUCTION_URL repository variable)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: production-monitor
  cancel-in-progress: true
jobs:
  smoke:
    if: ${{ inputs.production_url != '' || vars.PRODUCTION_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: ${{ inputs.production_url || vars.PRODUCTION_URL }}
      EXPECTED_REVISION: ${{ vars.PRODUCTION_REVISION }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Check TLS, routes, metadata, headers, and dependency readiness
        run: bash scripts/production-smoke.sh

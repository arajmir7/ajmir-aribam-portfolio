name: production-monitor
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      production_url:
        description: HTTPS origin to inspect (defaults to the PRODUCTION_URL repository variable)
        required: false
        type: string
      expected_revision:
        description: Full deployed Git commit SHA (defaults to the PRODUCTION_REVISION repository variable)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: production-monitor
  cancel-in-progress: true
jobs:
  smoke:
    if: ${{ (inputs.production_url != '' && (inputs.expected_revision != '' || vars.PRODUCTION_REVISION != '')) || (vars.PRODUCTION_URL != '' && vars.PRODUCTION_REVISION != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: ${{ inputs.production_url || vars.PRODUCTION_URL }}
      EXPECTED_REVISION: ${{ inputs.expected_revision || vars.PRODUCTION_REVISION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check TLS, routes, metadata, headers, and dependency readiness
        run: bash scripts/production-smoke.sh

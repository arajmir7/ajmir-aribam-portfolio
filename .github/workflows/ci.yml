name: quality-gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SITE_URL: https://ajmiraribam.me
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - run: uv sync --frozen --group dev
        working-directory: backend
      - run: npm run format:check
      - run: npx prettier --check '../README.md' '../RELEASE_CERTIFICATION.md' '../docs/*.md' '../compose.yaml' '../infra/*.yaml' '../.github/workflows/*.yml' '../backend/vercel.json'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --group dev
      - run: uv run ruff check . ../scripts/*.py && uv run ruff format --check . ../scripts/*.py
      - run: uv run python -c 'from app.main import app; assert app.title == "Portfolio inquiry service"'
      - run: bash ../scripts/verify-production-config.sh
      - run: uv run pytest -q
      - name: Verify PostgreSQL migrations, least-privilege access, and restore
        run: bash scripts/verify-postgres.sh
        working-directory: ${{ github.workspace }}
      - run: uvx pip-audit -r <(uv export --no-dev --format requirements-txt --no-hashes)
        shell: bash
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Scan complete repository history
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --no-banner --redact
  integration:
    needs: [web, api, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
        working-directory: frontend
      - run: uv sync --frozen --group dev
        working-directory: backend
      - name: Verify Docker Compose local database and migrations
        run: bash scripts/verify-compose.sh
      - name: Verify contact persistence and mocked Resend flow
        run: bash scripts/verify-email-outbox.sh
      - name: Check committed whitespace
        run: git diff --check && git show --check --oneline HEAD
